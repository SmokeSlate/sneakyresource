sync-on-startup: true
run-minecraft-reload-after-sync: true

resource-pack:
  enabled: true
  source-directory: "sneakyresource/sasquatchresourcepack"
  output-zip: "plugins/SneakyResource/generated/sasquatchresourcepack.zip"
  write-sha1-file: true
  sha1-output: "plugins/SneakyResource/generated/sasquatchresourcepack.zip.sha1"
  public-url: "https://smokeslate.github.io/sneakyresource/sasquatchresourcepack.zip"
  sha1-url: "https://smokeslate.github.io/sneakyresource/sasquatchresourcepack.zip.sha1"
  required: false
  prompt: "This server uses the SneakyResource pack."
  send-on-join: true

datapack:
  enabled: true
  source-directory: "sneakyresource/datapack"
  destination-directory: "world/datapacks/sneakyresource"

self-update:
  enabled: true
  run-on-startup: false
  repository-directory: "sneakyresource"
  branch: "main"
  build-command: ""
  artifact-path: ""
  build-when-unchanged: false
  stage-jar-in-update-folder: true
  sync-after-update: true
