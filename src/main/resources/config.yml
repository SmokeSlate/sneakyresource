sync-on-startup: true
run-minecraft-reload-after-sync: true

resource-pack:
  enabled: true
  source-directory: "SneakySasquatch/sasquatchresourcepack"
  output-zip: "plugins/SneakyResource/generated/sasquatchresourcepack.zip"
  write-sha1-file: true
  sha1-output: "plugins/SneakyResource/generated/sasquatchresourcepack.zip.sha1"
  public-url: "https://raw.githubusercontent.com/SmokeSlate/sneakyresource/pack-dist/sasquatchresourcepack.zip"
  sha1-url: "https://raw.githubusercontent.com/SmokeSlate/sneakyresource/pack-dist/sasquatchresourcepack.zip.sha1"
  required: false
  prompt: "This server uses the SneakyResource pack."
  send-on-join: true
  send-delay-ticks: 40
  retry-if-pending-ticks: 100

datapack:
  enabled: true
  source-directory: "SneakySasquatch/datapack"
  destination-directory: "world/datapacks/sneakyresource"

self-update:
  enabled: true
  run-on-startup: true
  repository-directory: "SneakySasquatch"
  branch: "main"
  build-command: ""
  artifact-path: ""
  build-when-unchanged: false
  stage-jar-in-update-folder: true
  sync-after-update: true
  sync-when-unchanged: true
  restart-after-update: true
  restart-command: ""
  restart-delay-seconds: 5
