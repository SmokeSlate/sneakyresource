name: Build

on:
  push:
    branches-ignore:
      - pack-dist*
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        run: chmod +x ./gradlew && ./gradlew build
      - name: Prepare dist payload
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/sneakyresource.jar
          cp build/resources/main/build-info.properties dist/build-info.properties
          cd sasquatchresourcepack
          zip -r ../dist/sasquatchresourcepack.zip . -x "*.DS_Store"
      - name: Write plugin sha1
        run: sha1sum dist/sneakyresource.jar > dist/sneakyresource.jar.sha1
      - name: Write resource pack sha1
        run: sha1sum dist/sasquatchresourcepack.zip > dist/sasquatchresourcepack.zip.sha1
      - name: Compute dist branch
        id: dist-branch
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          should_publish=true
          if [[ "$EVENT_NAME" == "pull_request" && "$PR_HEAD_REPO" != "$REPOSITORY" ]]; then
            should_publish=false
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            dist_branch="pack-dist-pr-${PR_NUMBER}"
          elif [[ "$REF_NAME" == "main" ]]; then
            dist_branch="pack-dist"
          elif [[ -n "$REF_NAME" ]]; then
            slug="$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g; s#-+#-#g; s#^-##; s#-$##')"
            dist_branch="pack-dist-branch-${slug}"
          else
            should_publish=false
            dist_branch=""
          fi

          echo "should_publish=${should_publish}" >> "$GITHUB_OUTPUT"
          echo "dist_branch=${dist_branch}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sneakyresource-build
          path: |
            dist/sneakyresource.jar
            dist/sneakyresource.jar.sha1
            dist/build-info.properties
            dist/sasquatchresourcepack.zip
            dist/sasquatchresourcepack.zip.sha1
          if-no-files-found: error
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sneakyresource.jar
            dist/sneakyresource.jar.sha1
            dist/build-info.properties
            dist/sasquatchresourcepack.zip
            dist/sasquatchresourcepack.zip.sha1
          generate_release_notes: true
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish resource pack branch
        if: ${{ !startsWith(github.ref, 'refs/tags/') && steps.dist-branch.outputs.should_publish == 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ steps.dist-branch.outputs.dist_branch }}
          publish_dir: ./dist

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
