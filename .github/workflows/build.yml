name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        run: chmod +x ./gradlew && ./gradlew build
      - name: Package resource pack
        run: |
          mkdir -p dist
          cd sasquatchresourcepack
          zip -r ../dist/sasquatchresourcepack.zip . -x "*.DS_Store"
      - name: Write resource pack sha1
        run: sha1sum dist/sasquatchresourcepack.zip > dist/sasquatchresourcepack.zip.sha1
      - uses: actions/upload-artifact@v4
        with:
          name: sneakyresource-build
          path: |
            build/libs/*.jar
            dist/sasquatchresourcepack.zip
            dist/sasquatchresourcepack.zip.sha1
          if-no-files-found: error
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            dist/sasquatchresourcepack.zip
            dist/sasquatchresourcepack.zip.sha1
          generate_release_notes: true
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish resource pack branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pack-dist
          publish_dir: ./dist

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
